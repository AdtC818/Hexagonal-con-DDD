services:

  # ── 1 MySQL con 4 schemas (ahorra ~600MB vs 4 instancias) ──────
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: uptc2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --performance-schema=OFF
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-puptc2026"]
      interval: 10s
      timeout: 5s
      retries: 8

  # ── Kafka KRaft (sin Zookeeper, ahorra ~300MB) ─────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── SERVICIOS con límites de RAM ───────────────────────────────
  orderservice:
    build:
      context: ./orderservice
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orders_db?serverTimezone=GMT-5
      SPRING_DATASOURCE_USERNAME: orders_user
      SPRING_DATASOURCE_PASSWORD: uptc2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx180m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 256M

  paymentservice:
    build:
      context: ./paymentservice
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payments_db?serverTimezone=GMT-5
      SPRING_DATASOURCE_USERNAME: payments_user
      SPRING_DATASOURCE_PASSWORD: uptc2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx180m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 256M

  shippingservice:
    build:
      context: ./shippingservice
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shipping_db?serverTimezone=GMT-5
      SPRING_DATASOURCE_USERNAME: shipping_user
      SPRING_DATASOURCE_PASSWORD: uptc2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx180m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 256M

  inventoryservice:
    build:
      context: ./inventoryservice
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db?serverTimezone=GMT-5
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: uptc2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx180m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 256M

  edakafka:
    build:
      context: ./edakafka
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eda_db?serverTimezone=GMT-5
      SPRING_DATASOURCE_USERNAME: eda_user
      SPRING_DATASOURCE_PASSWORD: uptc2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx180m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - orderservice
      - paymentservice
      - shippingservice
      - inventoryservice
      - edakafka
    environment:
      SERVICES_EDA_URL: http://edakafka:8080
      SERVICES_ORDER_URL: http://orderservice:8082
      SERVICES_PAYMENT_URL: http://paymentservice:8084
      SERVICES_SHIPPING_URL: http://shippingservice:8083
      SERVICES_INVENTORY_URL: http://inventoryservice:8085
      JAVA_OPTS: "-Xmx128m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  mysql_data:
  kafka_data: