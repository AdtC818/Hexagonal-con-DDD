server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/payments/**
        - id: shipping-service
          uri: http://localhost:8083
          predicates:
            - Path=/shipping/**
        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/inventory/**

# URLs de los microservicios por bounded context
services:
  order:
    url: http://localhost:8082
  payment:
    url: http://localhost:8084
  shipping:
    url: http://localhost:8083
  inventory:
    url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info